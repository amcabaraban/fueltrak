<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelTrak - Sales Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-2px); }
        @media print { nav, .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-gradient-to-r from-blue-900 to-blue-800 text-white shadow-xl sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-lg"><i class="fas fa-file-invoice text-2xl text-yellow-400"></i></div>
                <div><span class="font-bold text-lg">FuelTrak</span><p class="text-xs text-blue-300">Sales Orders</p></div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/dashboard" class="bg-white/20 px-3 py-1 rounded text-sm hover:bg-white/30"><i class="fas fa-tachometer-alt mr-1"></i>Dashboard</a>
                <button onclick="logout()" class="bg-red-500/80 px-3 py-1 rounded text-sm"><i class="fas fa-sign-out-alt mr-1"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex flex-wrap justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-file-invoice mr-2 text-blue-600"></i>Sales Orders</h1>
            <div class="flex gap-2 mt-2 sm:mt-0">
                <input type="text" id="searchSO" placeholder="Search SO number..." class="px-3 py-2 border rounded-lg text-sm w-48" oninput="loadSalesOrders()">
                <select id="statusFilter" class="px-3 py-2 border rounded-lg text-sm" onchange="loadSalesOrders()">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button onclick="showAddModal()" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 transition">
                    <i class="fas fa-plus mr-1"></i>New SO
                </button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="soSummary"></div>

        <!-- SO Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="py-3 px-3 text-left">SO Number</th>
                            <th class="py-3 px-3 text-left">Primary Client</th>
                            <th class="py-3 px-3 text-right">Total Volume</th>
                            <th class="py-3 px-3 text-right">Used</th>
                            <th class="py-3 px-3 text-center">Multi-Client</th>
                            <th class="py-3 px-3 text-center">Status</th>
                            <th class="py-3 px-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="soTableBody">
                        <tr><td colspan="7" class="text-center py-8 text-gray-400">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit SO Modal -->
    <div id="soModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between mb-4">
                <h3 class="text-lg font-bold" id="soModalTitle">New Sales Order</h3>
                <button onclick="closeSOModal()" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <form onsubmit="saveSalesOrder(event)" class="space-y-4">
                <input type="hidden" id="editSOId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">SO Number <span class="text-red-500">*</span></label>
                        <input type="text" id="soNumber" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500" required placeholder="e.g., SO-2026-001">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Primary Client <span class="text-red-500">*</span></label>
                        <select id="soClientId" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500" required onchange="updateClientName()">
                            <option value="">Select Client...</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Total Volume (Liters)</label>
                        <input type="number" id="soTotalVolume" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="e.g., 20000" min="0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Status</label>
                        <select id="soStatus" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="active">Active</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                
                <!-- Multi-Client Toggle -->
                <div>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="isMultiClient" class="w-4 h-4 mr-2" onchange="toggleMultiClient()">
                        <span class="text-sm font-semibold text-gray-700">Multi-Client SO</span>
                    </label>
                    <p class="text-xs text-gray-400 ml-6">Allow multiple clients to use this SO number</p>
                </div>
                
                <!-- Multi-Client Allocations -->
                <div id="multiClientSection" class="hidden space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-sm font-semibold text-gray-700">Client Allocations</h4>
                        <button type="button" onclick="addAllocationRow()" class="text-blue-600 text-xs hover:underline">
                            <i class="fas fa-plus mr-1"></i>Add Client
                        </button>
                    </div>
                    <div id="allocationRows"></div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Notes</label>
                    <textarea id="soNotes" class="w-full px-3 py-2 border rounded-lg text-sm" rows="2" placeholder="Optional notes..."></textarea>
                </div>
                
                <button type="submit" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-800 transition">
                    <i class="fas fa-save mr-1"></i>Save Sales Order
                </button>
            </form>
        </div>
    </div>

    <!-- View SO Details Modal -->
    <div id="soViewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between mb-4">
                <h3 class="text-lg font-bold">SO Details</h3>
                <button onclick="document.getElementById('soViewModal').classList.add('hidden')" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div id="soViewContent"></div>
        </div>
    </div>

    <script>
        const API = '/api';
        const token = localStorage.getItem('fueltrak_token');
        const user = JSON.parse(localStorage.getItem('fueltrak_user') || '{}');
        
        if (!token || !['dispatcher','management'].includes(user.role)) window.location.replace('/');
        
        let allClients = [];
        let editAllocations = [];

        async function api(url, method, body) {
            method = method || 'GET';
            var o = { method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } };
            if (body) o.body = JSON.stringify(body);
            var r = await fetch(API + url, o);
            return await r.json();
        }

        // Load clients list
        async function loadClientsList() {
            var d = await api('/sales-orders/clients-list');
            if (d.status === 'success') {
                allClients = d.data;
                var select = document.getElementById('soClientId');
                select.innerHTML = '<option value="">Select Client...</option>' +
                    d.data.map(c => '<option value="' + c.id + '">' + (c.company_name || c.email) + ' (' + c.email + ')</option>').join('');
                
                // Also populate allocation client dropdowns
                document.querySelectorAll('.alloc-client-select').forEach(function(sel) {
                    if (sel.options.length <= 1) {
                        sel.innerHTML = '<option value="">Select...</option>' +
                            d.data.map(c => '<option value="' + c.id + '">' + (c.company_name || c.email) + '</option>').join('');
                    }
                });
            }
        }

        // Load sales orders
        async function loadSalesOrders() {
            var search = document.getElementById('searchSO').value;
            var status = document.getElementById('statusFilter').value;
            var params = new URLSearchParams();
            if (search) params.append('search', search);
            if (status) params.append('status', status);
            
            var d = await api('/sales-orders?' + params.toString());
            if (d.status === 'success') {
                renderSOTable(d.data);
                renderSummary(d.data);
            }
        }

        function renderSummary(data) {
            var active = data.filter(s => s.status === 'active').length;
            var completed = data.filter(s => s.status === 'completed').length;
            var cancelled = data.filter(s => s.status === 'cancelled').length;
            var multiClient = data.filter(s => s.is_multi_client == 1).length;
            
            document.getElementById('soSummary').innerHTML = [
                { label: 'Total SOs', value: data.length, color: 'bg-blue-500' },
                { label: 'Active', value: active, color: 'bg-green-500' },
                { label: 'Multi-Client', value: multiClient, color: 'bg-purple-500' },
                { label: 'Completed', value: completed, color: 'bg-gray-500' }
            ].map(c => '<div class="stat-card ' + c.color + ' text-white rounded-xl shadow p-4"><p class="text-xs opacity-90">' + c.label + '</p><p class="text-2xl font-bold">' + c.value + '</p></div>').join('');
        }

        function renderSOTable(data) {
            if (!data.length) {
                document.getElementById('soTableBody').innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-400">No sales orders found</td></tr>';
                return;
            }
            
            document.getElementById('soTableBody').innerHTML = data.map(so => {
                var statusColor = so.status === 'active' ? 'bg-green-100 text-green-800' : 
                                 so.status === 'completed' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800';
                var totalVol = parseFloat(so.total_volume) || 0;
                var usedVol = parseFloat(so.used_volume) || 0;
                var remaining = totalVol - usedVol;
                var usagePercent = totalVol > 0 ? Math.round((usedVol / totalVol) * 100) : 0;
                
                return '<tr class="border-b hover:bg-gray-50 cursor-pointer" onclick="viewSO(' + so.id + ')">' +
                    '<td class="py-3 px-3 font-mono font-bold text-blue-900">' + so.so_number + '</td>' +
                    '<td class="py-3 px-3">' + (so.client_company || so.client_email) + '</td>' +
                    '<td class="py-3 px-3 text-right">' + totalVol.toLocaleString() + ' L</td>' +
                    '<td class="py-3 px-3 text-right">' +
                        '<div class="flex items-center justify-end space-x-2">' +
                        '<span class="text-xs">' + usedVol.toLocaleString() + ' L</span>' +
                        '<div class="w-16 bg-gray-200 rounded-full h-2"><div class="h-2 rounded-full ' + (usagePercent > 80 ? 'bg-red-500' : usagePercent > 50 ? 'bg-yellow-500' : 'bg-green-500') + '" style="width:' + usagePercent + '%"></div></div>' +
                        '</div>' +
                    '</td>' +
                    '<td class="py-3 px-3 text-center">' + (so.is_multi_client == 1 ? '<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-xs">Multi</span>' : '<span class="text-gray-400">-</span>') + '</td>' +
                    '<td class="py-3 px-3 text-center"><span class="px-2 py-0.5 rounded text-xs font-semibold ' + statusColor + '">' + so.status + '</span></td>' +
                    '<td class="py-3 px-3 text-center" onclick="event.stopPropagation()">' +
                        '<button onclick="editSO(' + so.id + ')" class="text-blue-600 mr-2"><i class="fas fa-edit"></i></button>' +
                        '<button onclick="deleteSO(' + so.id + ',\'' + so.so_number + '\')" class="text-red-600"><i class="fas fa-trash"></i></button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        function showAddModal() {
            document.getElementById('editSOId').value = '';
            document.getElementById('soModalTitle').textContent = 'New Sales Order';
            document.getElementById('soNumber').value = '';
            document.getElementById('soTotalVolume').value = '';
            document.getElementById('soStatus').value = 'active';
            document.getElementById('soNotes').value = '';
            document.getElementById('isMultiClient').checked = false;
            document.getElementById('multiClientSection').classList.add('hidden');
            document.getElementById('allocationRows').innerHTML = '';
            editAllocations = [];
            document.getElementById('soModal').classList.remove('hidden');
        }

        function closeSOModal() {
            document.getElementById('soModal').classList.add('hidden');
        }

        async function editSO(id) {
            var d = await api('/sales-orders/' + id);
            if (d.status === 'success') {
                var so = d.data;
                document.getElementById('editSOId').value = so.id;
                document.getElementById('soModalTitle').textContent = 'Edit Sales Order';
                document.getElementById('soNumber').value = so.so_number;
                document.getElementById('soClientId').value = so.client_id;
                document.getElementById('soTotalVolume').value = so.total_volume;
                document.getElementById('soStatus').value = so.status;
                document.getElementById('soNotes').value = so.notes || '';
                document.getElementById('isMultiClient').checked = so.is_multi_client == 1;
                
                editAllocations = so.allocations || [];
                
                if (so.is_multi_client == 1) {
                    document.getElementById('multiClientSection').classList.remove('hidden');
                    renderAllocationRows();
                } else {
                    document.getElementById('multiClientSection').classList.add('hidden');
                }
                
                document.getElementById('soModal').classList.remove('hidden');
            }
        }

        async function viewSO(id) {
            var d = await api('/sales-orders/' + id);
            if (d.status === 'success') {
                var so = d.data;
                var html = '<div class="grid grid-cols-2 gap-4 mb-4">' +
                    '<div><p class="text-xs text-gray-500">SO Number</p><p class="font-bold text-lg font-mono text-blue-900">' + so.so_number + '</p></div>' +
                    '<div><p class="text-xs text-gray-500">Primary Client</p><p class="font-semibold">' + (so.client_company || so.client_email) + '</p></div>' +
                    '<div><p class="text-xs text-gray-500">Total Volume</p><p class="font-semibold">' + parseFloat(so.total_volume).toLocaleString() + ' L</p></div>' +
                    '<div><p class="text-xs text-gray-500">Status</p><p class="font-semibold">' + so.status + '</p></div>' +
                    '</div>';
                
                if (so.allocations && so.allocations.length) {
                    html += '<h4 class="font-semibold mb-2">Client Allocations</h4>' +
                        '<table class="w-full text-sm border mb-4"><thead class="bg-gray-50"><tr>' +
                        '<th class="py-2 px-2">Client</th><th class="py-2 px-2 text-right">Allocated</th></tr></thead><tbody>' +
                        so.allocations.map(a => '<tr><td class="py-1 px-2">' + (a.company_name || a.email) + '</td><td class="py-1 px-2 text-right">' + parseFloat(a.allocated_volume).toLocaleString() + ' L</td></tr>').join('') +
                        '</tbody></table>';
                }
                
                if (so.atls && so.atls.length) {
                    html += '<h4 class="font-semibold mb-2">Related ATLs</h4>' +
                        '<table class="w-full text-xs border"><thead class="bg-gray-50"><tr>' +
                        '<th class="py-1 px-2">ATL Code</th><th class="py-1 px-2">Plate</th><th class="py-1 px-2 text-right">Volume</th><th class="py-1 px-2">Status</th></tr></thead><tbody>' +
                        so.atls.map(a => '<tr><td class="py-1 px-2 font-mono">' + a.atl_code + '</td><td class="py-1 px-2">' + a.plate_no + '</td><td class="py-1 px-2 text-right">' + parseFloat(a.volume).toLocaleString() + '</td><td class="py-1 px-2">' + a.status + '</td></tr>').join('') +
                        '</tbody></table>';
                }
                
                document.getElementById('soViewContent').innerHTML = html;
                document.getElementById('soViewModal').classList.remove('hidden');
            }
        }

        function toggleMultiClient() {
            var checked = document.getElementById('isMultiClient').checked;
            if (checked) {
                document.getElementById('multiClientSection').classList.remove('hidden');
                if (editAllocations.length === 0) addAllocationRow();
            } else {
                document.getElementById('multiClientSection').classList.add('hidden');
            }
        }

        function addAllocationRow() {
            var idx = editAllocations.length;
            editAllocations.push({ client_id: '', allocated_volume: 0 });
            renderAllocationRows();
        }

        function removeAllocationRow(idx) {
            editAllocations.splice(idx, 1);
            renderAllocationRows();
        }

        function updateAllocation(idx, field, value) {
            if (!editAllocations[idx]) editAllocations[idx] = {};
            editAllocations[idx][field] = value;
        }

        function renderAllocationRows() {
            document.getElementById('allocationRows').innerHTML = editAllocations.map(function(a, i) {
                return '<div class="flex gap-2 items-center bg-gray-50 p-2 rounded">' +
                    '<select class="flex-1 px-2 py-1.5 border rounded text-sm alloc-client-select" value="' + (a.client_id || '') + '" onchange="updateAllocation(' + i + ',\'client_id\',this.value)">' +
                    '<option value="">Select Client...</option>' +
                    allClients.map(c => '<option value="' + c.id + '" ' + (a.client_id == c.id ? 'selected' : '') + '>' + (c.company_name || c.email) + '</option>').join('') +
                    '</select>' +
                    '<input type="number" class="w-32 px-2 py-1.5 border rounded text-sm" placeholder="Volume (L)" value="' + (a.allocated_volume || '') + '" oninput="updateAllocation(' + i + ',\'allocated_volume\',this.value)">' +
                    '<button type="button" onclick="removeAllocationRow(' + i + ')" class="text-red-500 hover:text-red-700"><i class="fas fa-times"></i></button>' +
                    '</div>';
            }).join('');
        }

        function updateClientName() {
            // Auto-fill company name based on selected client
            var clientId = document.getElementById('soClientId').value;
            var client = allClients.find(c => c.id == clientId);
            // Company name is stored in the sales_orders table automatically
        }

        async function saveSalesOrder(e) {
            e.preventDefault();
            var id = document.getElementById('editSOId').value;
            var body = {
                so_number: document.getElementById('soNumber').value,
                client_id: document.getElementById('soClientId').value,
                total_volume: document.getElementById('soTotalVolume').value || 0,
                is_multi_client: document.getElementById('isMultiClient').checked,
                status: document.getElementById('soStatus').value,
                notes: document.getElementById('soNotes').value,
                allocations: editAllocations.filter(a => a.client_id && a.allocated_volume > 0)
            };
            
            var url = id ? '/sales-orders/' + id : '/sales-orders';
            var method = id ? 'PUT' : 'POST';
            
            var d = await api(url, method, body);
            if (d.status === 'success') {
                closeSOModal();
                loadSalesOrders();
            } else {
                alert(d.error || 'Error saving');
            }
        }

        async function deleteSO(id, soNumber) {
            if (!confirm('Delete SO ' + soNumber + '?')) return;
            var d = await api('/sales-orders/' + id, 'DELETE');
            if (d.status === 'success') {
                loadSalesOrders();
            } else {
                alert(d.error || 'Error deleting');
            }
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }

        // Initialize
        loadClientsList();
        loadSalesOrders();
    </script>
</body>
</html>
