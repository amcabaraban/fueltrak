<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelTrak - Announcements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="/js/session.js"></script>
    <style>
        @keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .priority-urgent { border-left: 4px solid #ef4444; }
        .priority-important { border-left: 4px solid #f59e0b; }
        .priority-normal { border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-gradient-to-r from-blue-900 to-blue-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-lg"><i class="fas fa-gas-pump text-2xl text-yellow-400"></i></div>
                <div><span class="font-bold text-lg">FuelTrak</span><p class="text-xs text-blue-300">Announcements</p></div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="userInfo" class="text-sm bg-white/10 px-3 py-1 rounded-full"></span>
                <a href="/dashboard" class="text-sm bg-white/20 px-3 py-1 rounded hover:bg-white/30">Dashboard</a>
                <a href="/client" class="text-sm bg-white/20 px-3 py-1 rounded hover:bg-white/30">Portal</a>
                <button onclick="logout()" class="bg-red-500/80 hover:bg-red-500 px-4 py-2 rounded text-sm"><i class="fas fa-sign-out-alt mr-1"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 rounded-2xl shadow-2xl p-6 mb-6 text-white">
            <h1 class="text-2xl font-bold"><i class="fas fa-bullhorn mr-2"></i>Company Announcements</h1>
            <p class="text-blue-200 text-sm mt-1">Stay updated with the latest news and notices</p>
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="filterAnnouncements('all')" class="announcement-filter px-4 py-2 rounded-full text-sm bg-blue-100 text-blue-700 font-semibold hover:bg-blue-200" data-filter="all">All</button>
            <button onclick="filterAnnouncements('urgent')" class="announcement-filter px-4 py-2 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-red-100 hover:text-red-700" data-filter="urgent"><i class="fas fa-exclamation-circle mr-1"></i>Urgent</button>
            <button onclick="filterAnnouncements('important')" class="announcement-filter px-4 py-2 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-orange-100 hover:text-orange-700" data-filter="important"><i class="fas fa-flag mr-1"></i>Important</button>
            <button onclick="filterAnnouncements('normal')" class="announcement-filter px-4 py-2 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-700" data-filter="normal"><i class="fas fa-info-circle mr-1"></i>Normal</button>
            <button onclick="filterAnnouncements('unread')" class="announcement-filter px-4 py-2 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-green-100 hover:text-green-700" data-filter="unread"><i class="fas fa-circle mr-1"></i>Unread</button>
            <button onclick="markAllRead()" class="px-4 py-2 rounded-full text-sm bg-green-100 text-green-700 hover:bg-green-200 ml-auto"><i class="fas fa-check-double mr-1"></i>Mark All Read</button>
        </div>

        <!-- Announcements List -->
        <div id="announcementList" class="space-y-4">
            <div class="text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>Loading announcements...</div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <i class="fas fa-bullhorn text-5xl text-gray-300 mb-4 block"></i>
            <p class="text-gray-500 text-lg">No announcements</p>
            <p class="text-gray-400 text-sm">Check back later for updates</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('fueltrak_token');
        const user = JSON.parse(localStorage.getItem('fueltrak_user') || '{}');
        if (!token) window.location.replace('/');
        document.getElementById('userInfo').textContent = user.email || '';

        let allAnnouncements = [];
        let currentFilter = 'all';

        async function loadAnnouncements() {
            try {
                const response = await fetch('/api/announcements', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    allAnnouncements = data.data;
                    renderAnnouncements();
                }
            } catch (e) {
                document.getElementById('announcementList').innerHTML = 
                    '<div class="text-center py-12 text-red-400"><i class="fas fa-exclamation-circle text-2xl mb-2 block"></i>Error loading announcements</div>';
            }
        }

        function renderAnnouncements() {
            let filtered = allAnnouncements;
            
            if (currentFilter === 'unread') {
                filtered = allAnnouncements.filter(a => !a.is_read);
            } else if (currentFilter !== 'all') {
                filtered = allAnnouncements.filter(a => a.priority === currentFilter);
            }

            const list = document.getElementById('announcementList');
            const empty = document.getElementById('emptyState');

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');

            const priorityIcons = {
                urgent: '<i class="fas fa-exclamation-circle text-red-500"></i>',
                important: '<i class="fas fa-flag text-orange-500"></i>',
                normal: '<i class="fas fa-info-circle text-blue-500"></i>'
            };

            const priorityColors = {
                urgent: 'bg-red-100 text-red-800',
                important: 'bg-orange-100 text-orange-800',
                normal: 'bg-blue-100 text-blue-800'
            };

            list.innerHTML = filtered.map(ann => `
                <div class="bg-white rounded-xl shadow-lg p-5 priority-${ann.priority} animate-fade-in cursor-pointer hover:shadow-xl transition ${!ann.is_read ? 'bg-blue-50' : ''}" 
                     onclick="markAsRead(${ann.id})">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            ${priorityIcons[ann.priority]}
                            <h3 class="font-bold text-lg ${!ann.is_read ? 'text-blue-900' : 'text-gray-800'}">${escapeHtml(ann.title)}</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            ${!ann.is_read ? '<span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>' : ''}
                            <span class="text-xs px-2 py-1 rounded-full font-semibold ${priorityColors[ann.priority]}">${ann.priority.toUpperCase()}</span>
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm mb-3 leading-relaxed">${escapeHtml(ann.message)}</p>
                    <div class="flex justify-between items-center text-xs text-gray-400">
                        <span><i class="fas fa-user-circle mr-1"></i>${escapeHtml(ann.created_by_email || 'Admin')}</span>
                        <span><i class="fas fa-clock mr-1"></i>${new Date(ann.created_at).toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
                    </div>
                    ${ann.expires_at ? `<p class="text-xs text-gray-400 mt-2"><i class="fas fa-calendar-times mr-1"></i>Expires: ${new Date(ann.expires_at).toLocaleDateString()}</p>` : ''}
                </div>
            `).join('');
        }

        function filterAnnouncements(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.announcement-filter').forEach(btn => {
                btn.classList.remove('bg-blue-100', 'text-blue-700', 'font-semibold');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            const activeBtn = document.querySelector(`[data-filter="${filter}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-100', 'text-gray-600');
                activeBtn.classList.add('bg-blue-100', 'text-blue-700', 'font-semibold');
            }
            
            renderAnnouncements();
        }

        async function markAsRead(id) {
            try {
                await fetch('/api/announcements/' + id + '/read', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                // Update local state
                const ann = allAnnouncements.find(a => a.id === id);
                if (ann) ann.is_read = 1;
                renderAnnouncements();
            } catch (e) {}
        }

        async function markAllRead() {
            try {
                await fetch('/api/announcements/read-all', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                allAnnouncements.forEach(a => a.is_read = 1);
                renderAnnouncements();
            } catch (e) {}
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            try { fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {}
            localStorage.clear();
            window.location.href = '/';
        }

        loadAnnouncements();
        // Refresh every 60 seconds
        setInterval(loadAnnouncements, 60000);
    </script>
</body>
</html>
